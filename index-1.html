<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precision Trimmers Barbershop</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171715">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trimmers">
<style>
:root{
  color-scheme:dark;
  --bg:#171715;
  --card:#22221f;
  --ink:#f4f0e7;
  --mute:#b7b0a2;
  --line:#403b30;
  --acc:#c9a45c;
  --accink:#171715;
  --gold-soft:#e1c987;
  --danger:#e07b72;
  --success:#91c59a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0 auto;
  background:
    radial-gradient(ellipse at top,rgba(201,164,92,.075),transparent 42%),
    var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  max-width:480px;
  min-height:100vh;
  padding:24px 16px 112px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:25px;line-height:1.2;letter-spacing:-.035em;margin:0;font-weight:800}
h2{font-size:18px;line-height:1.3;letter-spacing:-.015em;margin:24px 0 11px}
p{line-height:1.55}
.sub,.meta{color:var(--mute);font-size:14px}
.sub{margin:8px 0 18px}
.meta{font-size:13px}
.launch-notice{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin:18px 0 16px;padding:10px 12px;
  border:1px solid rgba(201,164,92,.42);
  border-radius:12px;background:rgba(201,164,92,.075);
  color:var(--mute);font-size:12px;
}
.launch-notice strong{
  color:var(--gold-soft);font-size:10px;letter-spacing:.12em;
  white-space:nowrap;
}
.steps{display:flex;gap:6px;margin:16px 0 6px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--acc)}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.025),transparent 75%),var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px;
  margin-bottom:10px;display:flex;align-items:center;gap:12px;
  cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit;
  transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.card:focus-visible,.chip:focus-visible,button:focus-visible,a:focus-visible,.in:focus-visible{
  outline:2px solid var(--gold-soft);outline-offset:3px;
}
.card:active{transform:scale(.99)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 24px rgba(0,0,0,.12)}
.ico{
  min-width:46px;height:46px;border-radius:13px;
  background:rgba(201,164,92,.12);color:var(--gold-soft);
  display:grid;place-items:center;flex:none;font-size:17px;padding:0 4px;
  border:1px solid rgba(201,164,92,.12);
}
.grow{flex:1;min-width:0}.name{font-weight:650}
.price{font-weight:800;color:var(--gold-soft);white-space:nowrap}
.row{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 8px;flex-wrap:wrap}
.chip{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:10px 12px;text-align:center;font:inherit;cursor:pointer;
  min-width:62px;transition:background .18s ease,border-color .18s ease;
}
.chip.sel{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.chip.off{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.scroll{flex-wrap:nowrap;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bar{
  position:fixed;left:0;right:0;bottom:0;
  background:rgba(23,23,21,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;max-width:480px;margin:0 auto;z-index:20;
}
.bar:empty{display:none}
button.main{
  flex:1;background:linear-gradient(135deg,#e0c27b,var(--acc));color:var(--accink);
  border:0;border-radius:13px;padding:14px 16px;font:inherit;font-weight:800;
  cursor:pointer;box-shadow:0 5px 16px rgba(201,164,92,.12);
}
button.main:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
button.ghost{
  background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:13px;padding:14px 16px;font:inherit;cursor:pointer;
}
.sum{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px;font-size:14px;margin-bottom:12px;
}
.sum>div{display:flex;justify-content:space-between;gap:14px;padding:5px 0}
.sum>div>span:last-child{text-align:right}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
.in{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;
  background:#1c1c19;color:var(--ink);font:inherit;margin-bottom:9px;
}
.in::placeholder{color:#898273}
.err{color:var(--danger);font-size:13px;min-height:16px}
.good{color:var(--success);font-size:13px}
.note{font-size:12px;color:var(--mute);margin-top:20px;text-align:center}
.ok{font-size:44px;text-align:center}
a{color:var(--gold-soft)}
.btn{
  display:inline-block;text-decoration:none;padding:12px 18px;border-radius:12px;
  background:var(--acc);color:var(--accink);font-weight:800;
}
.s{font-size:12px;padding:7px 10px;min-width:0;margin:2px}
.cards{display:block}
#app>h1{margin-bottom:2px}
#app .sum a{font-weight:650}
button,a,input,select{-webkit-tap-highlight-color:transparent}
@media (min-width:800px){
  body{max-width:1100px;padding:36px 40px 120px}
  .bar{max-width:1100px;padding:14px 40px}
  h1{font-size:34px}
  h2{font-size:21px;margin-top:28px}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cards .card{margin-bottom:0}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .in{max-width:560px}
  .sum{max-width:760px}
  button.main{max-width:420px}
  #app>h1{margin-top:4px}
}
@media (min-width:1150px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
select.in{width:auto;margin:0}
</style>
</head>
<body>
<div id="app"></div>

<script>

async function loadCfg(){try{var r=await api("/rest/v1/settings?select=data&id=eq.1");if(r.ok){var j=await r.json();if(j.length&&j[0].data&&j[0].data.styles&&j[0].data.styles.length){var d=j[0].data;CFG={open:+d.open||8,close:+d.close||18,slot:+d.slot||30,closed:Array.isArray(d.closed)?d.closed:[0],notice:d.notice||"",address:d.address||"",loyalty:d.loyalty===undefined?10:+d.loyalty,styles:d.styles}}}}catch(e){}buildT()}

(st.r?"<h2>How many cuts to book?</h2><div class='row'>"+[2,4,6,8].map(function(n){return "<button class='chip"+(st.c==n?" sel":"")+"' onclick='pickC("+n+")'>"+n+" cuts</button>"}).join("")+"</div>":"");

function waUrl(){var s=ST()[st.s],ds=dates();return "https://wa.me/"+WA+"?text="+encodeURIComponent("Hi, I booked at "+SHOP+": "+s.n+"\n"+ds.map(function(x){return fmt(x)+" "+st.t}).join("\n")+"\nName: "+nm+"\nRef "+ref)}
async function book(){err="";var p=ph.replace(/[ \-()]/g,"");
if(!nm.trim()){err="Please enter your name.";return render()}
if(!/^\+?[1-9][0-9]{9,14}$/.test(p)){err="Enter your WhatsApp number with country code (no leading 0).";return render()}
