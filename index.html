*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,rgba(var(--acc-rgb),.09),transparent 45%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:0 0 112px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:1280px;margin:0 auto;padding:16px}
.narrow{max-width:560px;margin:0 auto}
h1{font-size:25px;line-height:1.2;letter-spacing:-.035em;margin:0;font-weight:800}
h2{font-size:18px;line-height:1.3;letter-spacing:-.015em;margin:24px 0 11px}
h3{margin:0 0 8px}
.disp{font-family:Georgia,"Times New Roman",serif}
p{line-height:1.55}
.sub,.meta{color:var(--mute);font-size:14px}.sub{margin:8px 0 18px}.meta{font-size:13px}
.launch-notice{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0;padding:10px 12px;border:1px solid rgba(var(--acc-rgb),.42);border-radius:12px;background:rgba(var(--acc-rgb),.075);color:var(--mute);font-size:12px}
.launch-notice strong{color:var(--gold-soft);font-size:10px;letter-spacing:.12em;white-space:nowrap}
.card{background:linear-gradient(145deg,rgba(255,255,255,.025),transparent 75%),var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit;transition:border-color .18s ease,transform .18s ease}
.card:focus-visible,.chip:focus-visible,button:focus-visible,a:focus-visible,.in:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.card:active{transform:scale(.99)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 24px rgba(0,0,0,.12)}
.ico{min-width:46px;height:46px;border-radius:13px;background:rgba(var(--acc-rgb),.12);color:var(--gold-soft);display:grid;place-items:center;flex:none;font-size:17px;padding:0 4px;border:1px solid rgba(var(--acc-rgb),.14)}
.grow{flex:1;min-width:0}.name{font-weight:650}
.price{font-weight:800;color:var(--gold-soft);white-space:nowrap}
.row{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 8px;flex-wrap:wrap}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:center;font:inherit;cursor:pointer;min-width:62px;transition:background .18s ease,border-color .18s ease}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.sel{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.chip.off{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.scroll{flex-wrap:nowrap;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(var(--bg-rgb),.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:20}
.bar:empty{display:none}
.bar .bsum{flex:1;min-width:0;font-size:12px;color:var(--mute)}
button.main{flex:1;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--accink);border:0;border-radius:13px;padding:14px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 5px 16px rgba(var(--acc-rgb),.18)}
.bar button.main{flex:none;max-width:260px;border-radius:999px;padding:14px 22px}
button.main:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:14px 16px;font:inherit;cursor:pointer}
.sum{background:rgba(var(--card-rgb),.9);border:1px solid var(--line);border-radius:16px;padding:15px;font-size:14px;margin-bottom:12px}
.sum>div{display:flex;justify-content:space-between;gap:14px;padding:5px 0}.sum>div>span:last-child{text-align:right}
.list{margin:8px 0 0;padding:0;list-style:none}.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
.in{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--ink);font:inherit;margin-bottom:9px}
.in::placeholder{color:#6f7a70}
.err{color:var(--danger);font-size:13px;min-height:16px}.good{color:var(--success);font-size:13px}
.note{font-size:12px;color:var(--mute);margin-top:20px;text-align:center}
.ok{font-size:44px;text-align:center}a{color:var(--gold-soft)}
.btn{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:12px;background:var(--acc);color:var(--accink);font-weight:800}
.btn.line{background:transparent;color:var(--gold-soft);border:1px solid var(--acc)}
.s{font-size:12px;padding:7px 10px;min-width:0;margin:2px}
.cards{display:block}
select.in{width:auto;margin:0}
button,a,input,select{-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:var(--shop) center/cover no-repeat;opacity:.07;z-index:-1;pointer-events:none;filter:grayscale(.4)}
.hero{position:relative;border:1px solid rgba(var(--acc-rgb),.38);border-radius:22px;padding:16px 18px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;background-image:linear-gradient(180deg,rgba(var(--bg-rgb),0) 0%,rgba(var(--bg-rgb),.2) 45%,rgba(var(--bg-rgb),.94) 100%),var(--shop);background-size:cover;background-position:center 19%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero h1{margin-top:44px;text-shadow:0 2px 12px rgba(0,0,0,.6)}.hero h1 i{color:var(--acc)}
.hero-sub{margin:4px 0 0;font-size:13px;color:var(--ink);opacity:.88;max-width:420px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
.enter>*{animation:rise .32s ease both}
.tick{width:76px;height:76px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--accink);background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 0 0 8px rgba(var(--acc-rgb),.14);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.next{border:1px solid var(--acc);border-radius:18px;padding:14px 16px;margin:0 0 14px;background:linear-gradient(135deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.03)),var(--card)}
.next .eyebrow{display:block;margin-bottom:6px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.sum>.chart{gap:5px;display:flex;align-items:flex-end;height:140px;overflow-x:auto;padding:6px 2px 0;justify-content:flex-start}
.col{flex:1 0 20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute);gap:3px}
.col .b{width:100%;border-radius:6px 6px 0 0;background:rgba(var(--acc-rgb),.25);position:relative;min-height:2px;flex:none}
.col .p{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:6px 6px 0 0}
.week{display:grid;grid-template-columns:1fr;gap:10px}.week .card{margin-bottom:0}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease}
#splash.gone{opacity:0;pointer-events:none}
.sp-in{text-align:center}.sp-ico{font-size:54px;animation:pop .6s ease both}
.sp-name{margin-top:10px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--gold-soft)}
.note-line{font-size:13px;color:var(--ink);background:rgba(var(--acc-rgb),.08);border-left:2px solid var(--acc);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:8px;width:100%}
.fab{position:fixed;right:16px;bottom:92px;z-index:30;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;text-decoration:none;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--accink);box-shadow:0 6px 20px rgba(0,0,0,.45)}
body.barber .fab{display:none}
.openline{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(143,229,141,.18);flex:none}.dot.off{background:var(--danger);box-shadow:0 0 0 4px rgba(255,125,115,.18)}
.tag{font-size:10px;letter-spacing:.06em;color:var(--accink);background:var(--acc);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle;font-weight:800;white-space:nowrap}
.quote{border-left:2px solid var(--acc);padding-left:10px;margin:8px 0 0;font-style:italic}
.sum>.heat{gap:4px;padding:0;display:flex}.hr{flex:1;border-radius:8px;padding:8px 0;text-align:center;font-size:11px;color:var(--ink);border:1px solid var(--line);min-width:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}.confetti i{position:absolute;top:-14px;width:8px;height:14px;animation:fall 2.6s ease-in forwards}
:root.xmas button.main{background:linear-gradient(135deg,#d65a5a,#b02f2f);color:#fff}
:root.xmas .tile{border-top-color:#c0392b}
:root.xmas .hero{border-color:rgba(192,57,43,.6)}
:root.xmas .chip.sel,:root.xmas .cd.sel,:root.xmas .num{background:#b02f2f;border-color:#b02f2f;color:#fff}
html.big body{zoom:1.15}
#printsheet{display:none}
.ph{width:56px;height:56px;border-radius:13px;object-fit:cover;flex:none;border:1px solid rgba(var(--acc-rgb),.4)}
.up{display:inline-block;cursor:pointer}
/* client */
.nav{position:sticky;top:0;z-index:50;background:rgba(var(--bg-rgb),.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav:empty{display:none}
.nav-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink)}
.logo{width:40px;height:40px;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font:700 17px Georgia,serif;border-radius:7px;flex:none}
.bn{display:flex;flex-direction:column;line-height:1.15}.bn b{letter-spacing:.2em;font-size:12px}.bn small{letter-spacing:.38em;font-size:8px;color:var(--mute);margin-top:3px}
.links{display:none;gap:26px;margin:0 auto}.links a{color:var(--ink);text-decoration:none;font-size:14px;padding:6px 0;border-bottom:2px solid transparent}.links a:hover{border-color:var(--acc);color:var(--acc)}
.navr{margin-left:auto;display:flex;gap:12px;align-items:center}.mb{color:var(--ink);text-decoration:none;font-size:13px}

.bk{display:grid;grid-template-columns:1fr;gap:18px}

.svc .chk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--accink);display:none;place-items:center;font-size:13px;font-weight:800}.svc.sel .chk{display:grid}

.cdt{display:grid;grid-template-columns:1fr;gap:16px}
.cal{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

.sumcard{background:linear-gradient(180deg,rgba(var(--card-rgb),.95),rgba(var(--bg-rgb),.95));border:1px solid var(--line);border-radius:22px;padding:18px}

.foot{border-top:1px solid var(--line);margin-top:26px;padding:18px 4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
/* barber */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bhero{min-height:150px;margin-bottom:12px}.bhero h1{font-size:30px;margin-top:30px}
.hb{display:block}.todaycard{display:none}
.side{position:fixed;z-index:40;left:0;right:0;bottom:0;display:flex;background:rgba(var(--bg-rgb),.97);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.sbrand,.sfoot{display:none}
.side button{flex:1;min-width:0;background:none;border:0;color:var(--mute);font:inherit;font-size:9.5px;padding:6px 1px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.side button b{font-size:19px;font-weight:400}
.side button.on{color:var(--acc);background:rgba(var(--acc-rgb),.12)}
body.barber{padding-bottom:84px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.tile{display:flex;gap:12px;align-items:center;background:rgba(var(--card-rgb),.9);border:1px solid var(--line);border-top:2px solid var(--acc);border-radius:16px;padding:13px 14px}
.tile .ti{width:40px;height:40px;border-radius:50%;background:rgba(var(--acc-rgb),.14);display:grid;place-items:center;font-size:19px;flex:none}
.tile small{display:block;font-size:11px;color:var(--mute)}.tile b{display:block;font-size:24px;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.datebar{display:flex;align-items:center;gap:8px;margin:10px 0 4px}.datebar b{flex:1;text-align:center}
.panel{background:rgba(var(--card-rgb),.9);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.panel h3{font-size:17px}
.apph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.apph h3{margin:0;font-size:19px}
.dn{display:flex;align-items:center;gap:8px}
.grp{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:16px 0 4px}
.appt{display:grid;grid-template-columns:54px 38px minmax(0,1fr) auto;grid-template-areas:"at av ai vw" ". . as ap";gap:6px 12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.appt.on{background:rgba(var(--acc-rgb),.07);border-radius:12px}
.at{grid-area:at}.av{grid-area:av}.ai{grid-area:ai;min-width:0}.as{grid-area:as}.ap{grid-area:ap;text-align:right}.avw{grid-area:vw}
.at b{display:block;font-size:16px;line-height:1.1}.at small{color:var(--mute);font-size:11px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.5);color:var(--gold-soft)}.av.big{width:54px;height:54px;font-size:17px}
.ai b,.as b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}.ai small,.as small{color:var(--mute);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid;font-weight:700;white-space:nowrap}
.pill.done{color:var(--success);border-color:rgba(143,229,141,.5);background:rgba(143,229,141,.08)}
.pill.prog{color:#ffc65c;border-color:rgba(255,198,92,.5);background:rgba(255,198,92,.08)}
.pill.conf{color:#6cc3ff;border-color:rgba(108,195,255,.5);background:rgba(108,195,255,.08)}
.pill.up{color:var(--mute);border-color:var(--line)}
.pill.late{color:var(--danger);border-color:rgba(255,125,115,.5);background:rgba(255,125,115,.08)}
.who{display:flex;gap:12px;align-items:center;margin:6px 0 12px}.who small{display:block;color:var(--mute);font-size:12px}
.drow{padding:8px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.dacts{display:flex;flex-direction:column;gap:8px;margin-top:12px}.dacts button.main,.dacts button.ghost{width:100%;max-width:none}
.big-n{font-size:28px;font-weight:800;margin:2px 0 8px}
.ovg{display:grid;grid-template-columns:1fr;gap:16px}
.slot{display:flex;gap:10px;margin-bottom:8px}
.tm{flex:none;width:50px;padding-top:12px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.slot:not(.free):not(.blk) .tm{color:var(--gold-soft);font-weight:700}
.sb{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(var(--card-rgb),.9)}
.slot.free .sb{background:transparent;border-style:dashed;border-color:rgba(var(--acc-rgb),.35)}
.slot.blk .sb{opacity:.6;background:transparent}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bkh{display:flex;justify-content:space-between;gap:10px}
.acts{margin-top:8px}
.dash{display:block}.two{display:block}
.login{max-width:420px;margin:50px auto}
.hero-top>span:last-child{display:flex;gap:6px;flex-wrap:nowrap}.bn b{white-space:nowrap}.mb{white-space:nowrap}
@media (max-width:799px){.bhero .hero-top{justify-content:flex-end}.bhero .eyebrow{display:none}.bn b{font-size:10px;letter-spacing:.12em}.bn small{letter-spacing:.3em}.nav-in{gap:10px}.mb{font-size:12px}}
@media print{body>*:not(#printsheet){display:none!important}body{background:#fff!important;padding:0!important}body::before{display:none!important}#printsheet{display:block;color:#000;font-family:Arial,sans-serif;padding:16px}#printsheet h2{margin:0 0 4px}#printsheet table{width:100%;border-collapse:collapse;margin-top:12px}#printsheet td,#printsheet th{border:1px solid #999;padding:6px 8px;text-align:left;font-size:13px}}
@media (min-width:700px){.cdt{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.week{grid-template-columns:repeat(7,minmax(0,1fr))}.trust{flex-direction:row;flex-wrap:wrap;gap:18px}}
@media (min-width:800px){
#app{padding:24px 28px}
h1{font-size:34px}h2{font-size:21px;margin-top:28px}
.links{display:flex}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cards .card{margin-bottom:0}
.grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.in{max-width:560px}.sum{max-width:760px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}.two .sum{max-width:none}
.hero{min-height:176px;padding:20px 26px 24px}
.hb{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
.todaycard{display:flex;flex-direction:column;gap:8px;background:rgba(var(--bg-rgb),.78);border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-width:230px;backdrop-filter:blur(6px)}.todaycard span{font-size:13px;color:var(--mute)}
.bhero h1{font-size:40px}
.appt{grid-template-columns:62px 40px minmax(0,1.3fr) minmax(0,1fr) auto auto;grid-template-areas:"at av ai as ap vw"}
.ap{text-align:left}
}
@media (min-width:1000px){
.bk{grid-template-columns:minmax(0,.95fr) minmax(0,1.55fr) minmax(0,1fr);gap:26px;align-items:start}
.intro .chero{min-height:560px;background-size:auto,auto 150%;background-position:center,64% 100%}.chero h1{font-size:62px;margin-top:150px}
.sumcard{position:sticky;top:90px}
.cbar{display:none}
.fab{bottom:24px;right:24px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.dash aside{position:sticky;top:20px}.dash aside .cards{display:block}.dash aside .card{margin-bottom:10px}
body.barber{padding-bottom:40px;padding-left:244px}
body.barber #app{max-width:1400px}
.side{top:0;bottom:0;right:auto;width:244px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:20px 14px;gap:6px}
.sbrand{display:flex;align-items:center;gap:11px;margin:0 6px 22px}.side .bn b{letter-spacing:.13em;font-size:11px;white-space:nowrap}.side .bn small{letter-spacing:.3em}.sfoot{display:block;margin-top:auto;font:italic 16px Georgia,serif;color:var(--acc);padding:10px 8px;opacity:.85}
.side button{flex:none;flex-direction:row;font-size:15px;gap:14px;padding:13px 14px;text-align:left;border-radius:12px;justify-content:flex-start;color:var(--ink)}
.side button b{font-size:18px;width:24px}
.side button.on{background:rgba(var(--acc-rgb),.14);box-shadow:inset 3px 0 0 var(--acc)}
}
@media (min-width:1100px){.ovg{grid-template-columns:minmax(0,1fr) 350px;align-items:start}.ovg aside{position:sticky;top:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

var CFG=JSON.parse(JSON.stringify(DEF)),T=[];fillImgs();
var R=[{k:0,t:"Just once"},{k:1,t:"Every week"},{k:2,t:"Every 2 weeks"},{k:3,t:"Every 3 weeks"},{k:4,t:"Every 4 weeks"}];

// ===== HELPERS =====
function pad(n){return n<10?"0"+n:""+n}
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function buildT(){T=[];for(var m=CFG.open*60;m+CFG.slot<=CFG.close*60;m+=CFG.slot)T.push(pad(Math.floor(m/60))+":"+pad(m%60))}
function ST(){return CFG.styles.filter(function(x){return x.a!==false})}
function isClosed(x){return CFG.closed.indexOf(x.getDay())>-1}
function closedText(){return CFG.closed.length?"Closed on "+CFG.closed.map(function(d){return DL[d]+"s"}).join(", ")+".":"Open every day."}
function iso(x){return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function addDays(x,n){var y=new Date(x);y.setDate(y.getDate()+n);return y}
function today(){var x=new Date();x.setHours(0,0,0,0);return x}
function fmt(x){return DN[x.getDay()]+" "+x.getDate()+" "+MN[x.getMonth()]}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var cur="USD";
function M(u){return cur=="ZiG"&&RATE?"ZiG "+(u*RATE).toFixed(2):"$"+(+u).toFixed(2)}
var tok=null;try{tok=sessionStorage.getItem("tok")}catch(e){}
function api(path,o){o=o||{};var h={apikey:KEY,"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;if(o.prefer)h.Prefer=o.prefer;return fetch(API+path,{method:o.m||"GET",headers:h,body:o.b?JSON.stringify(o.b):undefined})}

async function loadCfg(){try{var r=await api("/rest/v1/settings?select=data&id=eq.1");if(r.ok){var j=await r.json();if(j.length&&j[0].data&&j[0].data.styles&&j[0].data.styles.length){var d=j[0].data;CFG={open:+d.open||8,close:+d.close||18,slot:+d.slot||30,closed:Array.isArray(d.closed)?d.closed:[0],notice:d.notice||"",address:d.address||"",loyalty:d.loyalty===undefined?10:+d.loyalty,launch:d.launch!==false,home:d.home!==false,homeFee:d.homeFee===undefined?1:(+d.homeFee||0),about:d.about||"",goal:+d.goal||0,theme:(!d.theme||d.theme=="default")?"lime":d.theme,reviews:d.reviews||"",styles:d.styles};CFG.styles.forEach(function(x){if(/[\u00c3\u00c2\u00e2\u00f0]/.test(x.i||"")){var m=DEF.styles.filter(function(y){return y.n==x.n})[0];x.i=m?m.i:"✂️"}})}}}catch(e){}fillImgs();buildT();applyPrefs()}

var st={step:0,s:null,d:null,t:null,r:0,c:4,pay:null,home:false},nm="",ph="",addr="",err="",busy={},offline=false,ref="",sending=false,dp=null;
async function loadTaken(){try{var r=await api("/rest/v1/rpc/taken_slots",{m:"POST",b:{d_from:iso(today()),d_to:iso(addDays(today(),220))}});if(!r.ok)throw 0;busy={};(await r.json()).forEach(function(x){busy[x.slot_date+"|"+String(x.slot_time).slice(0,5)]=1});offline=false}catch(e){offline=true}}
function dates(){var w=R[st.r].k,n=w?st.c:1,a=[];for(var i=0;i<n;i++)a.push(addDays(addDays(today(),st.d),i*w*7));return a}
function conflicts(){return st.t?dates().filter(function(x){return busy[iso(x)+"|"+st.t]}):[]}

var anim=true;

function pickS(i){st.s=i;render()}function pickD(i){st.d=i;st.t=null;render()}function pickT(i){st.t=T[i];render()}

function cut(){return(RATE?"<div style='text-align:right'><button class='chip s' onclick=\"cur=cur=='USD'?'ZiG':'USD';render()\">Prices in "+cur+" ⇄</button></div>":"")}
function ord(n){var j=n%10,k=n%100;return n+(j==1&&k!=11?"st":j==2&&k!=12?"nd":j==3&&k!=13?"rd":"th")}
function infoBox(){var h="";if(CFG.notice)h+="<div class='sum' style='background:var(--acc);color:var(--accink);border-color:var(--acc)'><b>"+esc(CFG.notice)+"</b></div>";
if(CFG.about||CFG.reviews)h+="<div class='sum'><b>Your barber</b>"+(CFG.about?"<p class='meta' style='margin:6px 0 0'>"+esc(CFG.about)+"</p>":"")+String(CFG.reviews||"").split("\n").filter(Boolean).slice(0,3).map(function(q){return "<p class='meta quote'>“"+esc(q)+"”</p>"}).join("")+"</div>";
h+="<div class='sum'><div><span>Open</span><span>"+pad(CFG.open)+":00 to "+pad(CFG.close)+":00</span></div><div><span></span><span class='meta'>"+closedText()+"</span></div>"+(CFG.address?"<div><span>Where</span><span>"+esc(CFG.address)+"</span></div>":"")+(CFG.home?"<div><span>Home visits</span><span>Available (+"+M(CFG.homeFee)+")</span></div>":"")+(CFG.loyalty>0?"<div><span>Loyalty</span><span>Every "+ord(CFG.loyalty)+" cut is free</span></div>":"")+"<div><span>Questions?</span><a href='https://wa.me/"+WA+"' target='_blank'>Chat on WhatsApp</a></div></div>";return h}

function icsHref(){var s=ST()[st.s],ds=dates(),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Trimmers//EN"];
function f(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"}
ds.forEach(function(x,i){var t=st.t.split(":"),a=new Date(x.getFullYear(),x.getMonth(),x.getDate(),+t[0],+t[1]),b=new Date(a.getTime()+CFG.slot*60000);
L.push("BEGIN:VEVENT","UID:"+ref+"-"+i+"@trimmers","DTSTAMP:"+f(new Date()),"DTSTART:"+f(a),"DTEND:"+f(b),"SUMMARY:Haircut at "+SHOP+" ("+s.n+")","LOCATION:"+(CFG.address||SHOP).replace(/[,;\n]/g," "),"END:VEVENT")});

function toggleBig(){try{localStorage.setItem("big",localStorage.getItem("big")=="1"?"0":"1")}catch(e){}applyPrefs()}
function openState(){var now=new Date(),m=now.getHours()*60+now.getMinutes();
if(!isClosed(now)&&m>=CFG.open*60&&m<CFG.close*60)return{open:true,text:"Open now · closes "+pad(CFG.close)+":00"};
for(var i=0;i<8;i++){var d=addDays(today(),i);if(isClosed(d))continue;if(i==0){if(m>=CFG.close*60)continue;return{open:false,text:"Opens today at "+pad(CFG.open)+":00"}}return{open:false,text:"Opens "+(i==1?"tomorrow":fmt(d))+" at "+pad(CFG.open)+":00"}}
return{open:false,text:"Closed"}}
function nextFree(){for(var i=1;i<=14;i++){var d=addDays(today(),i);if(isClosed(d))continue;for(var k=0;k<T.length;k++)if(!busy[iso(d)+"|"+T[k]])return fmt(d)+" · "+T[k]}return ""}
function openLine(){var o=openState(),nf=nextFree();return "<div class='openline'><span class='dot"+(o.open?"":" off")+"'></span><span>"+o.text+"</span></div>"+(nf?"<div class='openline' style='margin-top:2px'><span>🗓</span><span>Next free time: "+nf+"</span></div>":"")}

async function book(){err="";var p=ph.replace(/[ \-()]/g,"");

err="Could not save your booking. Please try again.";render()}catch(e){sending=false;err="No internet. Please try again.";render()}}

function freeDue(x){return CFG.loyalty>0&&waOk(x.phone)&&!x.paid&&((lc[x.phone]||0)+1)%CFG.loyalty==0}
